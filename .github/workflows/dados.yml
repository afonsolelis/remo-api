name: Atualizar dados

on:
  schedule:
    - cron: "0 3 * * *"  # 00:00 em Belém (UTC-3)
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # para o passo que mantém o agendamento ligado

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/sync_supabase.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # O GitHub desliga agendamentos após 60 dias sem atividade no repositório;
      # reativar o workflow a cada execução zera essa contagem.
      - name: Manter agendamento ativo
        if: always()
        run: gh workflow enable dados.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
