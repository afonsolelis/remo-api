<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remo nos Campeonatos</title>
  <!-- Troque o ?v= a cada mudança em style.css/app.js para furar o cache do navegador. -->
  <link rel="stylesheet" href="style.css?v=5">
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.54.1/dist/apexcharts.min.js"></script>
</head>
<body>
  <header>
    <h1>Remo nos Campeonatos</h1>
    <p id="atualizado">Carregando…</p>
  </header>

  <nav class="abas" id="abas"></nav>

  <main>
    <section class="filtro">
      <label for="time">Time</label>
      <select id="time"></select>
    </section>

    <section class="cards" id="cards"></section>

    <div id="vista-pontos">
      <section>
        <div class="titulo-secao">
          <h2>Simulação</h2>
          <button id="simular">Simular de novo</button>
        </div>
        <p class="nota" id="nota-sim"></p>
        <div id="grafico-posicoes"></div>
      </section>

      <section>
        <h2 id="titulo-pontos">Pontos por rodada</h2>
        <div id="grafico-pontos"></div>
      </section>

      <section>
        <h2>Próximos jogos</h2>
        <div class="rolagem"><table id="proximos"></table></div>
      </section>

      <section>
        <h2>Classificação</h2>
        <div class="rolagem"><table id="tabela"></table></div>
        <p class="nota" id="legenda"></p>
      </section>
    </div>

    <div id="vista-copa" hidden>
      <section>
        <h2 id="titulo-jogos">Jogos</h2>
        <div class="rolagem"><table id="jogos-copa"></table></div>
      </section>
      <div id="fases"></div>
    </div>
  </main>

  <footer>Dados: API de tabelas do ge. Simulação Poisson simples, rodada no seu navegador.</footer>
  <script src="app.js?v=5"></script>
</body>
</html>
